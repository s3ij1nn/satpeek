server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 8M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
        # JA4 TLS-fingerprint propagation (PROD only). Two paths:
        #
        #   A) Cloudflare orange-cloud — Cloudflare adds `cf-ja4` to every
        #      origin request automatically, no nginx change needed. The
        #      Ja4Capture middleware normalises it into X-SP-JA4 server-side.
        #
        #   B) Direct TLS termination at nginx — requires the nginx-ja4
        #      module (e.g. https://github.com/fooinha/nginx-ssl-ja4)
        #      compiled into the image. Once available, expose the value:
        #
        #          fastcgi_param HTTP_X_TLS_JA4 $ssl_ja4;
        #
        #      The middleware picks `x-tls-ja4` up the same way as `cf-ja4`.
        #      Stock nginx (this Docker image) doesn't ship the module — the
        #      line stays commented out so local dev keeps booting.
        #
        # fastcgi_param HTTP_X_TLS_JA4 $ssl_ja4;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Static assets — but fall back to Laravel for dynamic routes such as
    # /livewire/livewire.js, /filament/exports/*, /admin/*, etc.
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }
}
